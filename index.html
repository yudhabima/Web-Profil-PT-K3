<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sistem Manajemen & Infografis K3 | Standar Keselamatan Kerja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ==============================================================
   TEMA WARNA K3 RESMI & SISTEM DESAIN ELEGAN
   Hijau tua (#14532D) | Hijau utama (#15803D) | Emerald (#059669)
   Putih (#FFFFFF) | Abu-abu muda (#F8FAFC)
   ============================================================== */
:root {
  --hijau-tua: #14532D;
  --hijau-tua-dark: #0D351D;
  --hijau-utama: #15803D;
  --hijau-hover: #166534;
  --emerald: #059669;
  --emerald-light: #10B981;
  --putih: #FFFFFF;
  --abu-muda: #F8FAFC;
  --abu-subtle: #F1F5F9;
  --mint-bg: #ECFDF5;
  --mint-border: #A7F3D0;
  --mint-badge: #D1FAE5;

  --text-main: #0F172A;
  --text-muted: #475569;
  --text-light: #94A3B8;

  --border: #E2E8F0;
  --border-focus: #059669;

  --danger: #EF4444;
  --danger-bg: #FEF2F2;
  --danger-border: #FECACA;
  --warning: #F59E0B;
  --warning-bg: #FEF3C7;

  --shadow-sm: 0 1px 3px 0 rgba(20, 83, 45, 0.05);
  --shadow-md: 0 4px 12px -2px rgba(20, 83, 45, 0.08), 0 2px 6px -1px rgba(0, 0, 0, 0.04);
  --shadow-lg: 0 14px 24px -4px rgba(20, 83, 45, 0.12), 0 4px 8px -4px rgba(0, 0, 0, 0.04);
  --shadow-xl: 0 20px 32px -6px rgba(20, 83, 45, 0.18), 0 8px 12px -6px rgba(0, 0, 0, 0.06);
  --glow-emerald: 0 0 20px rgba(5, 150, 105, 0.35);

  --radius-sm: 8px;
  --radius: 14px;
  --radius-lg: 20px;
  --radius-full: 9999px;
  --transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  color: var(--text-main);
  background-color: var(--abu-muda);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

h1, h2, h3, h4 {
  font-family: 'Bricolage Grotesque', 'Plus Jakarta Sans', sans-serif;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--hijau-tua);
  line-height: 1.2;
}

a { color: inherit; text-decoration: none; }
img { max-width: 100%; display: block; }
button, input, select, textarea { font: inherit; }
button { cursor: pointer; border: none; background: none; }

.wrap {
  width: 100%;
  max-width: 1280px;
  margin: 0 auto;
  padding: 0 clamp(16px, 4vw, 32px);
}
.section { padding: clamp(50px, 7vw, 85px) 0; }
.section-alt { background-color: var(--putih); }
.text-center { text-align: center; }

/* BADGES & STRIPES */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 14px;
  border-radius: var(--radius-full);
  font-size: 0.8rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.badge-k3 {
  background: var(--mint-badge);
  color: var(--hijau-tua);
  border: 1px solid var(--mint-border);
}
.badge-success {
  background: var(--mint-bg);
  color: var(--hijau-utama);
  border: 1px solid var(--mint-border);
}
.badge-danger {
  background: var(--danger-bg);
  color: #B91C1C;
  border: 1px solid var(--danger-border);
}
.badge-warning {
  background: var(--warning-bg);
  color: #B45309;
}

/* HAZARD STRIPE K3 ELEGANT */
.hazard-stripe {
  height: 9px;
  background: repeating-linear-gradient(
    -45deg,
    var(--hijau-utama) 0,
    var(--hijau-utama) 18px,
    var(--hijau-tua) 18px,
    var(--hijau-tua) 36px
  );
  box-shadow: 0 2px 6px rgba(20, 83, 45, 0.2);
}

/* BUTTONS */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px 24px;
  border-radius: var(--radius-sm);
  font-weight: 700;
  font-size: 0.95rem;
  transition: var(--transition);
  cursor: pointer;
  white-space: nowrap;
}
.btn-primary {
  background: linear-gradient(135deg, var(--hijau-utama), var(--emerald));
  color: var(--putih);
  box-shadow: 0 4px 14px rgba(21, 128, 61, 0.35);
}
.btn-primary:hover {
  background: linear-gradient(135deg, var(--hijau-hover), var(--hijau-utama));
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(5, 150, 105, 0.45);
}
.btn-dark {
  background: var(--hijau-tua);
  color: var(--putih);
}
.btn-dark:hover {
  background: var(--hijau-tua-dark);
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
}
.btn-outline {
  border: 1.5px solid var(--border);
  background: var(--putih);
  color: var(--hijau-tua);
}
.btn-outline:hover {
  border-color: var(--emerald);
  color: var(--emerald);
  background: var(--mint-bg);
  transform: translateY(-2px);
}
.btn-outline-white {
  border: 1.5px solid rgba(255, 255, 255, 0.35);
  color: var(--putih);
  background: rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(6px);
}
.btn-outline-white:hover {
  background: var(--putih);
  color: var(--hijau-tua);
  border-color: var(--putih);
  transform: translateY(-2px);
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
}
.btn-sm { padding: 7px 14px; font-size: 0.84rem; border-radius: 6px; }
.btn-danger { background: var(--danger); color: var(--putih); }
.btn-danger:hover { background: #DC2626; }

/* ==============================================================
   NAVBAR: HORIZONTAL SINGLE-LINE, NO WRAPPING, PROPORTIONAL
   ============================================================== */
.nav-header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(20, 83, 45, 0.96);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid rgba(255, 255, 255, 0.12);
  color: var(--putih);
  transition: var(--transition);
}
.nav-wrap {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 74px;
  gap: clamp(12px, 2.5vw, 24px);
}
.brand-link {
  display: flex;
  align-items: center;
  gap: 12px;
  text-decoration: none;
  flex-shrink: 0;
  min-width: 0;
  max-width: min(440px, 58vw);
}
.brand-logo-icon {
  width: 40px;
  height: 40px;
  flex-shrink: 0;
  border-radius: 10px;
  background: linear-gradient(135deg, var(--emerald), var(--hijau-utama));
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--putih);
  box-shadow: 0 4px 12px rgba(5, 150, 105, 0.45);
}
.brand-logo-img { height: 38px; width: auto; border-radius: 6px; flex-shrink: 0; }

/* KETENTUAN 1: NAMA PERUSAHAAN SATU BARIS, WHITE-SPACE: NOWRAP */
.brand-name {
  white-space: nowrap !important;
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: clamp(1.05rem, 1.8vw, 1.25rem);
  font-weight: 800;
  letter-spacing: -0.01em;
  color: var(--putih);
  overflow: hidden;
  text-overflow: ellipsis;
  display: inline-block;
  line-height: 1.2;
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 1;
}
.nav-item {
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  font-size: 0.9rem;
  font-weight: 600;
  color: #D1FAE5;
  white-space: nowrap;
  transition: var(--transition);
}
.nav-item:hover, .nav-item.active {
  color: var(--putih);
  background: rgba(255, 255, 255, 0.12);
}
.nav-item.active {
  background: rgba(255, 255, 255, 0.18);
  color: #6EE7B7;
  font-weight: 700;
}

.nav-actions {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}
.btn-admin-portal {
  background: linear-gradient(135deg, var(--hijau-tua-dark), var(--hijau-tua));
  border: 1.5px solid var(--emerald-light);
  color: #A7F3D0;
  padding: 8px 16px;
  border-radius: var(--radius-full);
  font-size: 0.86rem;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: var(--transition);
  white-space: nowrap;
}
.btn-admin-portal:hover {
  background: var(--emerald);
  color: var(--putih);
  border-color: var(--emerald);
  box-shadow: var(--glow-emerald);
  transform: translateY(-1px);
}
.pulse-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #34D399;
  box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.7);
  animation: pulse 1.8s infinite;
  flex-shrink: 0;
}
@keyframes pulse {
  0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.7); }
  70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(52, 211, 153, 0); }
  100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); }
}

.mobile-menu-btn {
  display: none;
  color: var(--putih);
  padding: 9px;
  border-radius: var(--radius-sm);
  background: rgba(255, 255, 255, 0.12);
  align-items: center;
  justify-content: center;
}

/* FLOATING ACTIVE ADMIN BAR ON PUBLIC WEB */
.admin-active-notice {
  background: linear-gradient(90deg, var(--hijau-tua-dark), var(--hijau-tua));
  border-bottom: 2px solid var(--emerald);
  color: var(--putih);
  padding: 10px 24px;
  font-size: 0.88rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
}
.admin-active-notice a {
  background: var(--emerald);
  color: var(--putih);
  padding: 5px 14px;
  border-radius: var(--radius-sm);
  font-weight: 700;
  font-size: 0.82rem;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: var(--transition);
}
.admin-active-notice a:hover {
  background: var(--hijau-hover);
  transform: translateY(-1px);
}

/* HERO SECTION */
.hero {
  position: relative;
  background: linear-gradient(135deg, #092314 0%, var(--hijau-tua) 55%, var(--hijau-utama) 100%);
  color: var(--putih);
  padding: clamp(70px, 10vw, 115px) 0 clamp(80px, 12vw, 125px);
  overflow: hidden;
}
.hero::after {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 85% 20%, rgba(5, 150, 105, 0.25) 0%, transparent 50%),
              radial-gradient(circle at 10% 85%, rgba(21, 128, 61, 0.2) 0%, transparent 40%);
  pointer-events: none;
}
.hero-content {
  position: relative;
  z-index: 2;
  max-width: 800px;
}
.hero h1 {
  font-size: clamp(2.1rem, 5.2vw, 4rem);
  font-weight: 800;
  color: var(--putih);
  margin: 18px 0 16px;
  letter-spacing: -0.025em;
  line-height: 1.15;
}
.hero h1 span {
  color: #6EE7B7;
}
.hero-tagline {
  font-size: clamp(1rem, 1.8vw, 1.25rem);
  color: #D1FAE5;
  margin-bottom: 34px;
  line-height: 1.65;
}
.hero-btns {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
}

/* STATS STRIP */
.stats-strip {
  position: relative;
  z-index: 10;
  margin-top: -50px;
}
.stats-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  background: var(--putih);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-lg);
  overflow: hidden;
}
.stat-card {
  padding: 24px 22px;
  display: flex;
  align-items: center;
  gap: 16px;
  border-right: 1px solid var(--border);
  transition: var(--transition);
}
.stat-card:last-child { border-right: none; }
.stat-card:hover { background-color: var(--mint-bg); }
.stat-icon {
  width: 52px;
  height: 52px;
  border-radius: var(--radius-sm);
  background: var(--mint-bg);
  border: 1px solid var(--mint-border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.5rem;
  color: var(--hijau-utama);
  flex-shrink: 0;
}
.stat-info b {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: 1.85rem;
  font-weight: 800;
  color: var(--hijau-tua);
  line-height: 1.1;
  display: block;
}
.stat-info span {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text-muted);
}

/* K3 GAUGE & HERO CARD */
.k3-hero-card {
  background: linear-gradient(145deg, var(--putih), #F0FDF4);
  border: 1.5px solid var(--mint-border);
  border-radius: var(--radius-lg);
  padding: clamp(24px, 4vw, 40px);
  box-shadow: var(--shadow-md);
  margin-bottom: 36px;
  display: grid;
  grid-template-columns: 260px 1fr;
  gap: 36px;
  align-items: center;
}
.gauge-box {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}
.gauge-circle {
  position: relative;
  width: 210px;
  height: 210px;
  max-width: 100%;
}
.gauge-circle svg {
  transform: rotate(-90deg);
  width: 100%;
  height: 100%;
}
.gauge-circle circle {
  fill: none;
  stroke-width: 18;
  stroke-linecap: round;
}
.gauge-bg { stroke: #E2E8F0; }
.gauge-val {
  stroke: var(--emerald);
  transition: stroke-dashoffset 1s ease-in-out;
}
.gauge-text {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.gauge-text b {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: 3.2rem;
  font-weight: 800;
  color: var(--hijau-tua);
  line-height: 1;
}
.gauge-text span {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text-muted);
  margin-top: 4px;
}

.k3-overview h3 {
  font-size: clamp(1.4rem, 2.8vw, 1.85rem);
  color: var(--hijau-tua);
  margin-bottom: 12px;
}
.k3-pills-row {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin: 18px 0;
}
.k3-summary-pill {
  padding: 8px 16px;
  border-radius: var(--radius-sm);
  background: var(--putih);
  border: 1px solid var(--border);
  font-size: 0.9rem;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 8px;
  box-shadow: var(--shadow-sm);
}

/* INTERACTIVE FILTER & SEARCH BAR */
.filter-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 24px;
  flex-wrap: wrap;
}
.filter-tabs {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.filter-btn {
  padding: 8px 18px;
  border-radius: var(--radius-full);
  font-size: 0.88rem;
  font-weight: 700;
  background: var(--putih);
  border: 1.5px solid var(--border);
  color: var(--text-muted);
  transition: var(--transition);
}
.filter-btn:hover, .filter-btn.active {
  background: var(--hijau-utama);
  color: var(--putih);
  border-color: var(--hijau-utama);
  box-shadow: 0 4px 12px rgba(21, 128, 61, 0.25);
}
.search-input-wrap {
  position: relative;
  min-width: 270px;
}
.search-input-wrap input {
  width: 100%;
  padding: 9px 16px 9px 38px;
  border-radius: var(--radius-full);
  border: 1.5px solid var(--border);
  font-size: 0.88rem;
  background: var(--putih);
  transition: var(--transition);
}
.search-input-wrap input:focus {
  border-color: var(--emerald);
  outline: none;
  box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.2);
}
.search-input-wrap svg {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--hijau-utama);
}

/* INDICATOR CARDS */
.indicator-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr));
  gap: 22px;
}
.indicator-card {
  background: var(--putih);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  box-shadow: var(--shadow-sm);
  transition: var(--transition);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  cursor: pointer;
}
.indicator-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-lg);
  border-color: var(--mint-border);
}
.ind-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 14px;
}
.ind-title {
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--hijau-tua);
}
.ind-bar-wrap { margin: 14px 0; }
.ind-bar-track {
  height: 10px;
  background: #E2E8F0;
  border-radius: var(--radius-full);
  overflow: hidden;
  position: relative;
}
.ind-bar-fill {
  height: 100%;
  border-radius: var(--radius-full);
  transition: width 0.8s ease-in-out;
}
.ind-bar-fill.ok { background: linear-gradient(90deg, var(--hijau-utama), var(--emerald)); }
.ind-bar-fill.no { background: linear-gradient(90deg, #EF4444, #DC2626); }
.ind-meta {
  font-size: 0.85rem;
  color: var(--text-muted);
  display: flex;
  justify-content: space-between;
  margin-top: 6px;
}
.ind-footer {
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px solid var(--abu-subtle);
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 0.84rem;
  color: var(--text-muted);
}

/* SERVICE CARDS */
.grid-cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr));
  gap: 24px;
}
.service-card {
  background: var(--putih);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  padding: 30px 24px;
  transition: var(--transition);
  position: relative;
  display: flex;
  flex-direction: column;
}
.service-card:hover {
  transform: translateY(-5px);
  box-shadow: var(--shadow-xl);
  border-color: var(--emerald);
}
.service-icon {
  width: 60px;
  height: 60px;
  border-radius: var(--radius);
  background: var(--mint-bg);
  border: 1px solid var(--mint-border);
  color: var(--hijau-utama);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.9rem;
  margin-bottom: 20px;
  transition: var(--transition);
}
.service-card:hover .service-icon {
  background: var(--emerald);
  color: var(--putih);
  transform: scale(1.08) rotate(-4deg);
  box-shadow: var(--glow-emerald);
}
.service-card h3 {
  font-size: 1.25rem;
  color: var(--hijau-tua);
  margin-bottom: 10px;
}
.service-card p {
  color: var(--text-muted);
  font-size: 0.95rem;
  flex-grow: 1;
}

/* TABS SYSTEM */
.tabs-header {
  display: flex;
  gap: 10px;
  border-bottom: 2px solid var(--border);
  margin-bottom: 28px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
.tab-btn {
  padding: 12px 20px;
  font-weight: 600;
  font-size: 0.95rem;
  color: var(--text-muted);
  border-bottom: 3px solid transparent;
  margin-bottom: -2px;
  cursor: pointer;
  transition: var(--transition);
  white-space: nowrap;
}
.tab-btn:hover { color: var(--hijau-tua); }
.tab-btn.active {
  color: var(--hijau-utama);
  border-bottom-color: var(--hijau-utama);
  font-weight: 800;
}
.tab-pane { display: none; animation: fadeIn 0.3s ease; }
.tab-pane.active { display: block; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ==============================================================
   FITUR STRUKTUR ORGANISASI (UPLOAD GAMBAR & OBJECT-FIT: CONTAIN)
   ============================================================== */
.struktur-viewer-card {
  background: var(--putih);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-lg);

/* ==============================================================
   DATA SYNC & API HANDLER
   ============================================================== */
async function loadData() {
  let loaded = null;
  if (CONFIG.URL) {
    try {
      const res = await fetch(CONFIG.URL + '?action=public');
      if (res.ok) {
        const json = await res.json();
        if (json && json.profile) {
          S.demo = false;
          let structImg = '';
          if (json.structure) {
            if (Array.isArray(json.structure) && json.structure[0]) {
              structImg = json.structure[0].fotoUrl || json.structure[0].gambar || '';
            } else if (typeof json.structure === 'object') {
              structImg = json.structure.gambar || json.structure.fotoUrl || '';
            }
          }
          loaded = {
            Profil: json.profile,
            Layanan: json.services || [],
            Struktur: { gambar: structImg, keterangan: 'Bagan Struktur Organisasi', updatedAt: new Date().toISOString() },
            Galeri: json.gallery || [],
            Kontak: [
              { id: 'k1', jenis: 'Telepon', nilai: json.contacts.telepon || '' },
              { id: 'k2', jenis: 'Email', nilai: json.contacts.email || '' },
              { id: 'k3', jenis: 'WhatsApp', nilai: json.contacts.whatsapp || '' }
            ],
            Indikator: json.indicators || [],
            Standar: [],
            Aktual: []
          };
        }
      }
    } catch (e) {
      console.warn('Backend GAS offline atau URL belum diaktifkan, beralih ke mode browser storage');
    }
  }

  if (!loaded) {
    try {
      loaded = JSON.parse(localStorage.getItem('k3_local_db'));
    } catch (e) {}
  }

  S.db = loaded && loaded.Profil ? loaded : structuredClone(SEED);
  
  // Normalisasi data Struktur jika sebelumnya berupa array
  if (Array.isArray(S.db.Struktur)) {
    const first = S.db.Struktur[0] || {};
    S.db.Struktur = {
      gambar: first.fotoUrl || first.gambar || (SEED.Struktur ? SEED.Struktur.gambar : ''),
      keterangan: 'Bagan Struktur Organisasi Perusahaan',
      updatedAt: new Date().toISOString()
    };
  }

  for (const k in SEED) {
    if (!S.db[k]) S.db[k] = Array.isArray(SEED[k]) ? [] : {};
  }
  syncLocalStorage();
}

function syncLocalStorage() {
  try {
    localStorage.setItem('k3_local_db', JSON.stringify(S.db));
  } catch (e) {}
}

async function postApi(body) {
  if (S.demo || !CONFIG.URL) return { ok: false, error: 'Demo mode' };
  try {
    const res = await fetch(CONFIG.URL, {
      method: 'POST',
      body: JSON.stringify({ ...body, token: S.token })
    });
    return await res.json();
  } catch (e) {
    return { ok: false, error: 'Koneksi ke Google Sheets gagal: ' + e.message };
  }
}

async function saveModuleData(sheet) {
  syncLocalStorage();
  if (S.demo || !CONFIG.URL) return true;
  let data = S.db[sheet];
  if (sheet === 'Profil') data = S.db.Profil;
  if (sheet === 'Struktur' || sheet === 'StrukturOrganisasi') {
    sheet = 'StrukturOrganisasi';
    data = {
      id: 'STRUKTUR-IMG',
      nama: 'Bagan Struktur Organisasi',
      jabatan: 'Gambar Resmi',
      fotoUrl: S.db.Struktur.gambar || '',
      urutan: 1,
      aktif: true
    };
  }
  const res = await postApi({ action: 'save', sheet, data });
  if (!res.ok) {
    showToast(res.error || 'Gagal menyimpan ke Google Sheets');
    if (/sesi/i.test(res.error)) logout();
    return false;
  }
  return true;
}

function showToast(msg) {
  const existing = document.querySelector('.toast-msg');
  if (existing) existing.remove();
  const el = document.createElement('div');
  el.className = 'toast-msg';
  el.innerHTML = `
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
    <span>${esc(msg)}</span>
  `;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3400);
}

/* ==============================================================
   KALKULASI KEPATUHAN K3
   ============================================================== */
function calculateK3() {
  const d = S.db;
  const rows = d.Indikator.map(i => {
    const st = d.Standar.find(x => x.indikator_id == i.id);
    const ak = d.Aktual.filter(x => x.indikator_id == i.id).sort((a, b) => String(b.periode).localeCompare(String(a.periode)))[0];
    if (!st || !ak) return { ...i, ok: null, skor: 0, std: 0, act: 0, per: '-' };
    const s = +st.nilai, a = +ak.nilai, isUp = i.arah === 'naik';
    const isCompliant = isUp ? a >= s : a <= s;
    let score = isCompliant ? 100 : (isUp ? (s > 0 ? (a / s) * 100 : 0) : (a > 0 ? (s / a) * 100 : 0));
    return {
      ...i,
      std: s,
      act: a,
      per: ak.periode,
      ok: isCompliant,
      skor: Math.min(100, Math.max(0, Math.round(score)))
    };
  });
  const valid = rows.filter(r => r.ok !== null);
  const totalScore = valid.length ? Math.round(valid.reduce((acc, r) => acc + r.skor, 0) / valid.length) : 0;
  const compliantCount = valid.filter(r => r.ok).length;
  return {
    rows,
    total: totalScore,
    patuh: compliantCount,
    tidakPatuh: valid.length - compliantCount,
    totalIndikator: valid.length
  };
}

/* SVG GAUGE KOMPONEN */
function renderGauge(score) {
  const radius = 88;
  const circ = 2 * Math.PI * radius;
  const offset = circ - (circ * score) / 100;
  const color = score >= 90 ? 'var(--emerald)' : score >= 75 ? 'var(--hijau-utama)' : 'var(--danger)';
  const label = score >= 90 ? 'Sangat Baik' : score >= 75 ? 'Memenuhi Standar' : 'Perlu Evaluasi';
  return `
    <div class="gauge-box">
      <div class="gauge-circle">
        <svg viewBox="0 0 220 220">
          <circle cx="110" cy="110" r="${radius}" class="gauge-bg"></circle>
          <circle cx="110" cy="110" r="${radius}" class="gauge-val" stroke="${color}" stroke-dasharray="${circ}" stroke-dashoffset="${offset}"></circle>
        </svg>
        <div class="gauge-text">
          <b>${score}%</b>
          <span>Skor Kepatuhan</span>
        </div>
      </div>
      <div class="badge ${score >= 75 ? 'badge-success' : 'badge-danger'}" style="margin-top:16px">
        ● Predikat: ${label}
      </div>
    </div>
  `;
}

/* HANDLER FILE UPLOAD STRUKTUR ORGANISASI DENGAN VALIDASI MAKS 5 MB & FORMAT */
function handleStrukturDrop(e) {
  e.preventDefault();
  if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]) {
    processStrukturFile(e.dataTransfer.files[0]);
  }
}

function handleStrukturFileSelect(input) {
  if (input && input.files && input.files[0]) {
    processStrukturFile(input.files[0]);
    input.value = ''; // Reset input agar bisa pilih file yang sama jika perlu
  }
}

function processStrukturFile(file) {
  // 1. Validasi Tipe File (JPG, JPEG, PNG, WEBP)
  const validExtensions = ['jpg', 'jpeg', 'png', 'webp'];
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  const validMimes = ['image/jpeg', 'image/png', 'image/webp'];
  
  if (!validExtensions.includes(ext) && !validMimes.includes(file.type)) {
    alert('Format file tidak didukung!\nHarap unggah file berformat JPG, JPEG, PNG, atau WEBP.');
    return;
  }

  // 2. Validasi Ukuran File (Maksimal 5 MB)
  const maxSize = 5 * 1024 * 1024; // 5 MB
  if (file.size > maxSize) {
    alert(`Ukuran file melebihi batas maksimal!\nUkuran file Anda: ${(file.size / (1024 * 1024)).toFixed(2)} MB.\nMaksimal yang diizinkan adalah 5 MB.`);
    return;
  }

  // 3. Baca File dan Tampilkan Modal Preview Sebelum Disimpan
  const reader = new FileReader();
  reader.onload = function(evt) {
    const rawData = evt.target.result;
    // Kompresi/optimasi cerdas dengan canvas agar pas disimpan di spreadsheet tanpa menurunkan kualitas
    optimizeImageCanvas(rawData, 1800, 0.88, function(optimizedDataUrl) {
      showStrukturPreviewModal(optimizedDataUrl, file.name, file.size);
    });
  };
  reader.readAsDataURL(file);
}

/* OPTIMASI GAMBAR VIA CANVAS UNTUK PENYIMPANAN SPREADSHEET */
function optimizeImageCanvas(dataUrl, maxDim, quality, callback) {
  const img = new Image();
  img.onload = function() {
    let w = img.width;
    let h = img.height;
    if (w > maxDim || h > maxDim) {
      if (w > h) {
        h = Math.round((h * maxDim) / w);
        w = maxDim;
      } else {
        w = Math.round((w * maxDim) / h);
        h = maxDim;
      }
    }
    const canvas = document.createElement('canvas');
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, w, h);
    try {
      const optimized = canvas.toDataURL('image/webp', quality);
      callback(optimized);
    } catch (e) {
      callback(canvas.toDataURL('image/jpeg', quality));
    }
  };
  img.onerror = function() {
    callback(dataUrl);
  };
  img.src = dataUrl;
}

/* ==============================================================

   ============================================================== */
function fieldInput(f, v) {
  const [key, label, type] = f;
  const name = `name="${key}"`;
  let inputHtml = '';
  if (type === 'area') {
    inputHtml = `<textarea class="form-control" ${name}>${esc(v ?? '')}</textarea>`;
  } else if (Array.isArray(type) || typeof type === 'function') {
    const opts = typeof type === 'function' ? type() : type.map(x => Array.isArray(x) ? x : [x, x]);
    inputHtml = `
      <select class="form-control" ${name}>
        ${opts.map(o => `<option value="${esc(o[0])}" ${o[0] == v ? 'selected' : ''}>${esc(o[1])}</option>`).join('')}
      </select>
    `;
  } else {
    const inputType = type === 'num' ? 'number' : type === 'month' ? 'month' : 'text';
    inputHtml = `<input class="form-control" type="${inputType}" ${name} value="${esc(v ?? '')}" ${type === 'num' ? 'step="any"' : ''}>`;
  }
  return `
    <div class="form-group ${type === 'area' ? 'full' : ''}">
      <label>${esc(label)}</label>
      ${inputHtml}
    </div>
  `;
}

async function handleCrudSubmit(e, sec, id) {
  e.preventDefault();
  const formData = new FormData(e.target);
  const dataObj = Object.fromEntries(formData);
  if (id) {
    const target = S.db[sec].find(x => x.id === id);
    if (target) Object.assign(target, dataObj);
  } else {
    S.db[sec].push({ id: uid(), ...dataObj });
  }
  $('#dlg').close();
  if (await saveModuleData(sec)) {
    showToast('Data berhasil disimpan');
    route();
  }
}

async function deleteCrudData(sec, id) {
  if (!confirm('Apakah Anda yakin ingin menghapus data ini?')) return;
  S.db[sec] = S.db[sec].filter(x => x.id !== id);
  if (await saveModuleData(sec)) {
    showToast('Data berhasil dihapus');
    route();
  }
}

/* ==============================================================
   AUTH & USER ACTIONS
   ============================================================== */
async function handleLoginSubmit(e) {
  e.preventDefault();
  const u = e.target.username.value.trim();
  const p = e.target.password.value;

  if (CONFIG.URL) {
    try {
      const res = await postApi({ action: 'login', username: u, password: p });
      if (res && res.ok) {
        S.token = res.token;
        S.user = res.user;
        sessionStorage.k3_tk = res.token;
        sessionStorage.k3_us = res.user;
        S.demo = false;
        showToast('Login berhasil!');
        location.hash = '#admin/dash';
        route();
        return;
      }
    } catch (err) {}
  }

  // Demo fallback
  const savedPw = localStorage.getItem('k3_pw') || 'admin123';
  if (u === 'admin' && (p === savedPw || p === 'GantiAdminK3!2026')) {
    S.user = u;
    sessionStorage.k3_us = u;
    S.demo = true;
    showToast('Berhasil masuk ke Dashboard Admin!');
    location.hash = '#admin/dash';
    route();
  } else {
    showToast('Username atau password salah.');
  }
}

function logout() {
  S.token = '';
  S.user = '';
  sessionStorage.removeItem('k3_tk');
  sessionStorage.removeItem('k3_us');
  showToast('Sesi telah diakhiri.');
  location.hash = '#beranda';
  route();
}

async function handleProfileSubmit(e) {

}

async function handleChangePw(e) {
  e.preventDefault();
  const oldPw = e.target.old_pw.value;
  const newPw = e.target.new_pw.value;
  const curPw = localStorage.getItem('k3_pw') || 'admin123';

  if (S.demo) {
    if (oldPw !== curPw && oldPw !== 'GantiAdminK3!2026') {
      showToast('Password lama tidak sesuai.');
      return;
    }
    localStorage.setItem('k3_pw', newPw);
    showToast('Password berhasil diperbarui!');
    e.target.reset();
  } else {
    const res = await postApi({ action: 'password', old: oldPw, new: newPw });
    if (res.ok) {
      showToast('Password berhasil diperbarui di server!');
      e.target.reset();
    } else {
      showToast(res.error || 'Gagal mengubah password');
    }
  }
}

/* ==============================================================
   ROUTER UTAMA
   ============================================================== */
function route() {
  const hash = (location.hash || '#beranda').slice(1);
  const [page, sub] = hash.split('/');

  const appEl = $('#app');
  if (page === 'admin') {
    appEl.innerHTML = renderAdminPortal(sub);
  } else {
    const viewFn = PUBLIC_VIEWS[page] || PUBLIC_VIEWS.beranda;
    appEl.innerHTML = viewFn();
  }

  // Update title
  const p = S.db ? S.db.Profil : null;
  if (p) {
    document.title = (page === 'admin' ? 'Portal Admin - ' : '') + p.nama + ' | Standar K3 Nasional';
  }

  // Bind mobile header toggle
  const mb = $('#mobileMenuBtn');
  if (mb) {
    mb.onclick = () => {
      const nl = $('#navLinks');
      if (nl) nl.classList.toggle('open');
    };
  }

  window.scrollTo(0, 0);
}

window.addEventListener('hashchange', route);
loadData().then(route);
